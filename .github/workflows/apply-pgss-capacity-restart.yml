name: Apply fixed statement capacity and controlled restart
run-name: Apply pgss capacity restart 5609 (${{ inputs.mode }}) ${{ inputs.expected_head }}
on:
  workflow_dispatch:
    inputs:
      work_issue:
        description: Fixed owning issue (5609 only)
        required: true
        default: '5609'
        type: string
      expected_head:
        description: Exact current main source SHA
        required: true
        type: string
      mode:
        description: Execution mode (preview_only for rehearsal; preview_and_production inside NY weekend window)
        required: true
        default: preview_only
        type: choice
        options:
          - preview_only
          - preview_and_production
permissions:
  contents: read
concurrency:
  group: shared-db-pg-stat-statements-capacity-restart
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      pull-requests: read
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      WORK_ISSUE: ${{ inputs.work_issue }}
      MODE: ${{ inputs.mode }}
      PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact current main without database credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$WORK_ISSUE" = 5609
          test "$MODE" = preview_only -o "$MODE" = preview_and_production
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/gh-read.mjs --out "$RUNNER_TEMP/main.json" api "repos/$GITHUB_REPOSITORY/commits/main"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/main.json"))["sha"]==os.environ["GITHUB_SHA"]'
      - name: Acquire existing native preview lane
        id: native_lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pgss-restart-exclusive.mjs acquire preview
      - name: Apply fixed preview capacity with controlled restart and verify effective 40000
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/apply_pgss_capacity_restart.py --target preview --mode "$MODE" --output "$RUNNER_TEMP/preview/preview-restart.json"
      - name: Release only this job's native preview lane
        if: ${{ always() && steps.native_lock.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pgss-restart-exclusive.mjs release preview
      - uses: actions/upload-artifact@v4
        with:
          name: pgss-restart-preview-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/preview/preview-restart.json
          if-no-files-found: error
          retention-days: 30

  production:
    needs: preview
    if: ${{ needs.preview.result == 'success' && inputs.mode == 'preview_and_production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      WORK_ISSUE: ${{ inputs.work_issue }}
      MODE: ${{ inputs.mode }}
      PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pgss-restart-preview-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/preview
      - name: Verify exact current main without database credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$WORK_ISSUE" = 5609
          test "$MODE" = preview_and_production
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/gh-read.mjs --out "$RUNNER_TEMP/main.json" api "repos/$GITHUB_REPOSITORY/commits/main"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/main.json"))["sha"]==os.environ["GITHUB_SHA"]'
      - name: Acquire existing native production lane
        id: native_lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pgss-restart-exclusive.mjs acquire production
      - name: Apply fixed production capacity with controlled restart inside NY window
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/apply_pgss_capacity_restart.py --target production --mode "$MODE" --preview-receipt "$RUNNER_TEMP/preview/preview-restart.json" --output "$RUNNER_TEMP/production/production-restart.json"
      - name: Release only this job's native production lane
        if: ${{ always() && steps.native_lock.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pgss-restart-exclusive.mjs release production
      - uses: actions/upload-artifact@v4
        with:
          name: pgss-restart-production-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/production/production-restart.json
          if-no-files-found: error
          retention-days: 30
