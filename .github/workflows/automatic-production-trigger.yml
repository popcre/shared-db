name: Automatic production promotion trigger

# popcre/ai-devops plan_skinny-review.md rule 8.6 (stage G, #2075). No session
# or person starts production promotion: this starts the existing post-merge
# preview rehearsal for the oldest merged migration PR not yet in production,
# whose automatic-production-promotion job then dispatches the production
# apply. A blocking review-finding issue holds the PR (checked here, again
# before dispatch, and again immediately before the apply step).

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'config/nontransactional-index-maintenance.json']
  # Start the next PR as soon as a dispatched apply succeeds OR fails (#5532).
  # Failures used to wait for the hourly schedule or a merge, which idled the
  # whole queue for up to an hour (2026-11-02: a failed preview at 7:49 PM EST,
  # nothing dispatched until 8:57 PM EST). Prompt reaction is not a retry loop:
  # the selector caps every PR at three automatic attempts since its merge,
  # counting failed preview AND production runs, and passes a PR out of attempts
  # over with a loud ENGINEER ACTION REQUIRED alert so later PRs keep promoting.
  #
  # This listener only sees completions of runs a USER dispatched with their own
  # token: GitHub never delivers workflow_run events for completions of runs the
  # GITHUB_TOKEN dispatched, which is how the selector's own dispatches start
  # (verified 2026-11-03). The migrations workflow's notify-production-queue
  # job therefore emits one `production-queue-nudge` repository_dispatch per
  # dispatched run, whatever the outcome -- a repository_dispatch created by
  # the token DOES create a run. The hourly schedule stays as the backstop.
  workflow_run:
    workflows: ['Shared Supabase Migrations']
    types: [completed]
  repository_dispatch:
    types: [production-queue-nudge]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-production-trigger-${{ vars.LANE_EPOCH || '0' }}
  cancel-in-progress: false

jobs:
  trigger:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_dispatch' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' || github.event.workflow_run.conclusion == 'timed_out'))
    runs-on: ubuntu-latest
    # The selector processes the production ledger (~1000 versions) and scans
    # every merged migration PR via the GitHub API. 10 minutes was too tight:
    # runs routinely hit 8+ minutes and got cancelled before dispatching.
    # 30 minutes gives the selector room to complete without changing its logic.
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      issues: write  # report_stuck_change must open/update the owned stuck-change tracking issue (#5771)
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # #6508: queued runs of this trigger were cancelled before any job
      # started (concurrency queue overflow), so the serial lane never drained.
      # Cheap lane guard first: while a migration apply run is already in
      # progress, skip the whole job with success in seconds -- the apply's
      # completion nudge (or the hourly cron) re-arms this trigger once the
      # lane frees. Fail-open: a failed query continues to the selector, whose
      # own wait logic still serializes dispatches.
      - name: Skip while a migration apply run is in progress
        id: lane_guard
        run: |
          set -eu
          if ! lane=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow shared-supabase-migrations.yml \
              --event workflow_dispatch \
              --limit 20 --json status 2>/tmp/lane-guard.err); then
            echo "::warning::lane guard query failed (fail-open); continuing to the selector"
            cat /tmp/lane-guard.err || true
            exit 0
          fi
          # Same predicate as the selector's wait (automatic_promotion_candidates
          # fetches event=workflow_dispatch only): a dispatched run not yet
          # completed holds the serial lane. CI runs (pull_request, merge_group)
          # of the same workflow never hold the lane -- counting them starved
          # every nudge on busy CI nights.
          count=$(printf '%s' "$lane" | jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "skip: a migration workflow run is in progress; its completion nudge re-arms this trigger"
            exit 0
          fi
      - uses: actions/checkout@v4
        if: steps.lane_guard.outputs.skipped != 'true'
      # #5937: the selector arms the backstop merge freeze through the node
      # coordination CLI.
      - uses: actions/setup-node@v4
        if: steps.lane_guard.outputs.skipped != 'true'
        with:
          node-version: 22
      # Maintenance selects first: a promotion dispatched first would make every
      # selection see an active run, and a held PR fails the promotion step.
      - name: Select an explicitly enabled exact-index maintenance operation
        id: index_maintenance
        if: steps.lane_guard.outputs.skipped != 'true'
        run: python scripts/automatic_index_maintenance.py
      # #6352: read-only production ledger so already-live changes are not retried.
      - name: Read the production migration ledger (read-only)
        if: always() && steps.lane_guard.outputs.skipped != 'true' && steps.index_maintenance.outputs.dispatched != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/write-production-ledger.mjs "$RUNNER_TEMP/production-ledger.json"
      # #6493 Step 1b: merged-PR API facts (merged_at, migration files) cached
      # between runs. Discovery only -- holds, attempts and the ledger are
      # re-read every run. A miss or corrupt cache is a full (slow) scan.
      - name: Restore the selector PR cache
        if: always() && steps.lane_guard.outputs.skipped != 'true' && steps.index_maintenance.outputs.dispatched != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/promotion-pr-cache.json
          key: promotion-pr-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: promotion-pr-cache-v1-
      - name: Start the next automatic promotion
        id: selector
        if: always() && steps.lane_guard.outputs.skipped != 'true' && steps.index_maintenance.outputs.dispatched != 'true'
        env:
          PRODUCTION_LEDGER_FILE: ${{ runner.temp }}/production-ledger.json
          PROMOTION_PR_CACHE_FILE: ${{ runner.temp }}/promotion-pr-cache.json
          PYTHONUNBUFFERED: '1'
        run: python scripts/automatic_promotion_candidates.py
      - name: Save the selector PR cache
        if: always() && steps.selector.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/promotion-pr-cache.json
          key: promotion-pr-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
