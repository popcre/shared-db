name: ColdLion Item Heartbeat

# #5011: the new-item heartbeat. ONE tiny GET every 5 minutes asks ColdLion
# for the single newest item (/items?sort=createdTime,desc&size=1) and
# dispatches the existing item sweep when that item was created within the
# window. Recorded live evidence on issue #5011 (2026-10-29): createdFrom is
# DAY-TYPED (three instants across one day return identical counts) so a time
# window cannot be built on it; sort=createdTime,desc works, is ECHOED by the
# envelope (asserted — a vendor change fails loudly), and vendor createdTime is
# America/New_York wall time (correlated with one-sweep-cycle landing times).
# modifiedFrom serves createdFrom semantics, so item edits land at the three
# anchor sweeps plus the nightly masters run (trade-off recorded on #5011).
#
# Load: ~288 tiny two-row GETs/day + on-demand full sweeps (throttled to at
# most one per 10 minutes; measured 2-41 new items/day) + 3 anchor sweeps. The
# old schedule pulled the full /items list every 30 minutes (~100 paged
# requests × 48 ≈ 4,800 heavy requests/day); this is a large reduction at the
# measured rates, with new-item latency of ~6-10 minutes instead of up to 30.
# Owner direction 2026-10-29: "i'd rather not wait 30 minutes if i don't have
# to."
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: coldlion-item-heartbeat
  cancel-in-progress: false

jobs:
  probe:
    name: Any new ColdLion items? (one tiny GET)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the heartbeat probe's offline tests first
        run: node --test tools/coldlion-item-heartbeat.test.mjs

      - name: Probe ColdLion for items created since the window
        id: probe
        env:
          COLDLION_API_KEY: ${{ secrets.COLDLION_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${COLDLION_API_KEY:-}" ] || { echo "::error::COLDLION_API_KEY is not set."; exit 1; }
          # Capture WITHOUT set -e so a failing probe's diagnostic still prints
          # (review M2: command substitution under pipefail discarded it).
          set +e
          OUT="$(node tools/coldlion-item-heartbeat.mjs)"
          RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -eq 0 ] || exit "$RC"
          if printf '%s' "$OUT" | jq -e '.trigger == true' >/dev/null; then
            echo "trigger=yes" >> "$GITHUB_OUTPUT"
          else
            echo "trigger=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch the item sweep on new items (throttled)
        if: steps.probe.outputs.trigger == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One sweep per 10 minutes at most (review M1): a 6-minute probe window
          # over a 5-minute cadence could otherwise re-dispatch on the same item.
          # Throttle only on runs that did (or are doing) real work: a FAILED
          # sweep must not block the retry (round-5 L4).
          LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow coldlion-item-sweep.yml \
            --limit 1 --json createdAt,status,conclusion \
            --jq '.[0] | select(.status == "in_progress" or .conclusion == "success") | .createdAt // ""')
          if [ -n "$LAST" ]; then
            AGE_MIN=$(( ( $(date +%s) - $(date -u -d "$LAST" +%s) ) / 60 ))
            if [ "$AGE_MIN" -lt 10 ]; then
              echo "A sweep already started ${AGE_MIN}m ago; skipping this dispatch."
              exit 0
            fi
          fi
          gh workflow run coldlion-item-sweep.yml --ref main
