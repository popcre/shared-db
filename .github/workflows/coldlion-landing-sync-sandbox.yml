# Nightly ColdLion order and production history for the DesignFlow SANDBOX only.
#
# Owner request (Albert Hazan, 2026-10-09, verbatim): "both the database for the test
# sandbox and for production should get the nightly factory order and sales order
# updates." Issue #3869.
#
# Target: the DesignFlow non-production Supabase project xupnyeifmpsacrqahwwm, never
# shared production and never shared preview. The target is
# hard-coded below and proved by the loader itself (COLDLION_EXPECTED_PROJECT_REF) before
# any write. The password is the designflow-sandbox ENVIRONMENT secret that
# designflow-sandbox-migrations.yml already uses; the connection is the IPv4 session
# pooler, because GitHub runners have no IPv6 route to db.<ref>.supabase.co.
#
# What it runs: tools/coldlion-landing/sync-history.mjs --forward
#   * the trailing re-read of the most recent CLOSED grid windows, every scope
#     (/orderHistory and /prodHistory ISS, INTRAN, REC), sealed with page evidence;
#   * the forward scan for /orderHistory (Settled rule "Forward-scan horizon", Albert,
#     2026-09-17): the open current week and every later window, loaded UNSEALED, until
#     two consecutive start-date months land no sales-order line.
# The factory-order jobs for this sandbox are Cloud Scheduler jobs in GCP project
# lithe-breaker-323913 (sandbox-albert-getprodorderheader 1:15 AM, ...detail 1:45 AM
# America/New_York); this run is scheduled between them at 05:30 UTC (1:30 AM EDT,
# 12:30 AM EST). GitHub cron is UTC and may start late; it is not a hard clock.
#
# Production scheduling is NOT here: coldlion-landing-sync.yml owns production.

name: ColdLion Landing Sync (DesignFlow sandbox)

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: "Nightly refresh, or a bounded history backfill"
        type: choice
        options: [refresh, backfill]
        default: refresh
      windows:
        description: "refresh: how many recent closed 7-day windows to re-read"
        required: false
        default: '3'
      from:
        description: "backfill: first window date (YYYY-MM-DD, grid anchor 2019-01-01)"
        required: false
        default: '2019-01-01'
      to:
        description: "backfill: newest window date (clamped to the newest CLOSED window)"
        required: false
      limit:
        description: "backfill: window/scope pairs per run (a multi-year backfill is a series of bounded runs; resumable from the ledger)"
        required: false
        default: '160'
      dry_run:
        description: "Report the work; write nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# The ONE sandbox writer lock, shared with designflow-sandbox-migrations.yml and
# sandbox-ledger-orphan-reconciliation.yml, so a sync never runs inside a migration apply.
concurrency:
  group: designflow-sandbox-migrations
  cancel-in-progress: false

jobs:
  sync:
    name: Sandbox order and production history
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 300
    environment: designflow-sandbox
    env:
      COLDLION_EXPECTED_PROJECT_REF: xupnyeifmpsacrqahwwm
      SANDBOX_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DESIGNFLOW_SANDBOX }}
      COLDLION_API_KEY: ${{ secrets.COLDLION_API_KEY }}
      OPERATION: ${{ inputs.operation || 'refresh' }}
      WINDOWS: ${{ inputs.windows || '3' }}
      FROM: ${{ inputs.from || '2019-01-01' }}
      TO: ${{ inputs.to || '' }}
      LIMIT: ${{ inputs.limit || '160' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove psql is present
        run: psql --version
      - name: Run the offline contract tests before touching anything
        run: node --test tools/coldlion-landing-history.test.mjs
      - name: Refuse to run without the target secrets
        run: |
          set -euo pipefail
          [ "$COLDLION_EXPECTED_PROJECT_REF" = "xupnyeifmpsacrqahwwm" ] || { echo "::error::target is not the DesignFlow sandbox"; exit 1; }
          [ -n "${SANDBOX_PASSWORD:-}" ] || { echo "::error::SUPABASE_DB_PASSWORD_DESIGNFLOW_SANDBOX is not set."; exit 1; }
          [ -n "${COLDLION_API_KEY:-}" ] || { echo "::error::COLDLION_API_KEY is not set."; exit 1; }
          [[ "$WINDOWS" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "::error::windows must be 1-999"; exit 1; }
          [[ "$LIMIT" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::limit must be 1-9999"; exit 1; }
          [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::from must be YYYY-MM-DD"; exit 1; }
          [ -z "$TO" ] || [[ "$TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::to must be YYYY-MM-DD"; exit 1; }
      - name: Sync
        run: |
          set -euo pipefail
          # Build the URL in-process so the password is never echoed or passed as an argument.
          ENCODED="$(node -e 'process.stdout.write(encodeURIComponent(process.env.SANDBOX_PASSWORD))')"
          echo "::add-mask::$ENCODED"
          export DATABASE_URL="postgresql://postgres.${COLDLION_EXPECTED_PROJECT_REF}:${ENCODED}@aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require"
          if [ "$OPERATION" = "backfill" ]; then
            ARGS=(--from "$FROM" --limit "$LIMIT")
            if [ -n "$TO" ]; then ARGS+=(--to "$TO"); fi
            if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
            node tools/coldlion-landing/backfill-history.mjs "${ARGS[@]}"
          else
            ARGS=(--windows "$WINDOWS" --forward)
            if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
            node tools/coldlion-landing/sync-history.mjs "${ARGS[@]}"
          fi
