# Curation packet tests that need a disposable PostgreSQL 17 database (#5690).
#
# scripts/tests/*.py suites that read T2_CURATION_TEST_DATABASE_URL were
# committed with curation packets (e.g. #5683) but no workflow ran them, so the
# abstain-on-conflict identity guards had no CI coverage. This job runs every
# such suite against a throwaway service database: no secrets, no project
# contact. A second job runs the opt-in Docker drills for #5703 (#5722).
# Advisory only; it is not a required check.
name: Curation SQL Tests

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curation-sql-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  curation:
    name: Curation SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: t2_curation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Run every disposable-database curation suite
        env:
          T2_CURATION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/t2_curation
        working-directory: scripts/tests
        run: |
          set -euo pipefail
          mapfile -t suites < <(grep -l T2_CURATION_TEST_DATABASE_URL test_*.py | sort)
          test "${#suites[@]}" -gt 0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            # Each suite gets a fresh database so fixtures never leak between them.
            psql -X -q -v ON_ERROR_STOP=1 postgresql://postgres@127.0.0.1:5432/postgres \
              -c 'drop database if exists t2_curation with (force)' -c 'create database t2_curation'
            python -m unittest -v "${suite%.py}"
            echo "::endgroup::"
          done

  # #5722: the #5703 batched-anchor equivalence, NaN, scope, permission and
  # one-pass drills start their own network-less pgvector container and were
  # opt-in only, so default CI never ran them.
  semantic-anchor-drills:
    name: Batched semantic anchor drills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the isolated pgvector drills
        env:
          DAM_BATCH_ANCHOR_DOCKER: '1'
        run: python -m unittest -v scripts/test_dam_batched_semantic_anchors.py
