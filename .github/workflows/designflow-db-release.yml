name: DesignFlow database release readiness

on:
  pull_request:
    paths:
      - 'scripts/designflow-db-release*'
      - 'scripts/designflow-contract-sync*'
      - 'scripts/lib/designflow-db-*'
      - 'config/designflow-db-releases.json'
      - '.github/workflows/designflow-db-release.yml'
      - '.github/workflows/shared-supabase-migrations.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release validation, orchestration, and real synthetic catalog queries
        shell: bash
        run: |
          set -euo pipefail
          container="dflow-release-gate-ci-${GITHUB_RUN_ID}"
          docker run -d --rm --name "$container" --memory 512m -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          trap 'docker stop "$container" >/dev/null' EXIT
          ready=false
          for attempt in {1..30}; do
            if docker exec "$container" pg_isready -U postgres >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          DFLOW_RELEASE_CATALOG_TEST_CONTAINER="$container" node --test scripts/lib/designflow-db-release.test.mjs scripts/lib/designflow-db-catalog.test.mjs scripts/designflow-db-release.test.mjs scripts/designflow-contract-sync.test.mjs

  observe:
    needs: test
    if: >-
      always() && github.repository == 'popcre/shared-db' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && needs.test.result == 'skipped') ||
       (github.event_name == 'workflow_dispatch' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: designflow-database-release-observer-${{ vars.LANE_EPOCH || '0' }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mint the existing designated App status publisher for six applications
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.POP_AI_WATCHERS_APP_ID }}
          private-key: ${{ secrets.POP_AI_WATCHERS_PRIVATE_KEY }}
          owner: popcre
          repositories: |
            designflow-backend
            designflow-bff
            designflow-frontend
            designflow-item-master
            designflow-tracking
            designflow-data-syncing
          permission-contents: read
          permission-statuses: write
      - name: Mint a read-only App token for the observer's GitHub reads
        id: reader
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.POP_AI_WATCHERS_APP_ID }}
          private-key: ${{ secrets.POP_AI_WATCHERS_PRIVATE_KEY }}
          owner: popcre
          repositories: |
            shared-db
            designflow-backend
            designflow-bff
            designflow-frontend
            designflow-item-master
            designflow-tracking
            designflow-data-syncing
          permission-contents: read
          permission-actions: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Observe exact releases and reuse qualified canonical promotion
        env:
          # Existing central operator credential. Never copied to applications.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # Reads use this App token when minted (own allowance, shared-db#6772);
          # writes and refused reads stay on the operator credential.
          DFLOW_GITHUB_READ_TOKEN: ${{ steps.reader.outputs.token }}
          DFLOW_READINESS_STATUS_TOKEN: ${{ steps.publisher.outputs.token }}
          DFLOW_READINESS_APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SHARED_DB_SESSION_ID: github-actions-${{ github.run_id }}
          SHARED_DB_AUTHOR_ENGINE: codex
        shell: bash
        run: |
          set -euo pipefail
          node scripts/designflow-db-release.mjs --observe | tee "$RUNNER_TEMP/designflow-database-readiness.json"
      - name: Record which allowance the observer spent (counts only, shared-db#6772)
        if: always()
        continue-on-error: true
        env:
          OPERATOR_TOKEN: ${{ secrets.SYNC_TOKEN }}
          READ_TOKEN: ${{ steps.reader.outputs.token }}
        shell: bash
        run: |
          node scripts/report-token-allowance.mjs OPERATOR_TOKEN READ_TOKEN
      - name: Preserve exact-source readiness results, including refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designflow-database-readiness
          path: ${{ runner.temp }}/designflow-database-readiness.json
          if-no-files-found: error
          retention-days: 30

  contract-sync:
    needs: observe
    # The sync must run when observe FAILS too: a contract mismatch makes the
    # observer exit 1 (blocked result, application status failure), and that is
    # exactly the state the sync has to route. Only a skipped observe (PR event
    # or failed tests) keeps the sync off.
    if: >-
      always() && github.repository == 'popcre/shared-db' && github.ref == 'refs/heads/main' &&
      (needs.observe.result == 'success' || needs.observe.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: designflow-contract-sync-${{ vars.LANE_EPOCH || '0' }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auto-sync app contracts to central policy
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIMO_SESSION_ID: github-actions-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/designflow-contract-sync.mjs
