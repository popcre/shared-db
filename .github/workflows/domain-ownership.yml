name: Domain Ownership

# scripts/check-domain-ownership.mjs scans the WHOLE tracked tree via `git ls-files`.
# It formerly also ran inside `db-data-admin.yml` (moved to u2giants/popdam3 on 2026-09-16);
# that workflow was `paths:`-filtered, so a
# PR touching an unwatched file (e.g. HANDOFF.md) could TRIP the guard while firing no
# run that could ever clear it (HANDOFF.md B2; PR #328 fixed the file and fired nothing,
# PR #307 cleared main only by accident). This workflow has DELIBERATELY NO `paths:`
# filter so the repo-wide guard runs on every pull request and every push to main.
# The guard stays here because it scans this repository's own docs for the hostname.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: domain-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-ownership:
    name: Domain ownership
    runs-on: ubuntu-latest
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enforce DB Data Admin domain ownership
        run: |
          node --test scripts/check-domain-ownership.test.mjs
          node scripts/check-domain-ownership.mjs
