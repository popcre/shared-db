# Generates the canonical typed contract for consumer applications.
# Consumer-return production evidence: docs/agents/generated-types-consumer-proof.md.
#
# WHY THIS EXISTS
# ---------------
# `shared-db` owns the STRUCTURE of the shared Supabase database, and the sync
# workflow (`sync.yml`) already mirrors this repository's root into the
# `shared-db/` subfolder of every consumer repo. Until now that mirror carried
# the migrations and the SQL contract tests, but nothing a TypeScript
# application could compile against, so each consumer hand-maintained its own
# idea of the schema. Hand-maintained copies drift silently, and the drift is
# only discovered at runtime.
#
# This workflow produces ONE generated artifact, `types/database.types.ts`, from
# a REAL database rather than from anyone's memory of it.
#
# WHY IT RUNS IN CI AND NOT ON A LAPTOP
# -------------------------------------
# Generating from the live preview project needs the Supabase access token and
# the preview database password. Those live in GitHub secrets and must stay
# there. Running the generator here means the artifact is reproducible by anyone
# with permission to press the button, and no shared-database credential is ever
# copied onto a personal machine.
#
# WHY PREVIEW AND NOT PRODUCTION
# ------------------------------
# Preview is the rehearsal target and is the first place a merged migration
# lands, so it is the earliest HONEST source of the post-change shape. This
# workflow is READ-ONLY against preview: it runs `supabase gen types` and
# nothing else. It can never write to preview and is not permitted to point at
# production at all -- the guard below refuses the production ref outright.
#
# HOW TO USE IT
# -------------
#   1. Apply the migration to preview through `shared-supabase-migrations.yml`.
#   2. Run this workflow.
#   3. Download the `database-types` artifact and commit `types/database.types.ts`
#      through a normal reviewed pull request. It is deliberately NOT committed
#      automatically: a generated file that changes without review is how a
#      schema change reaches nine applications unnoticed.

name: Generate database types

on:
  workflow_dispatch:
    inputs:
      schemas:
        description: "Comma-separated schemas to include in the generated contract"
        type: string
        required: true
        default: "public,dflow,plm,core,app,hts_rag"
      work_issue:
        description: "Optional open shared-db issue requiring generated_types: required; blank keeps the preview download path"
        type: string
        required: false
        default: ""
      application_commit_sha:
        description: "Noncanonical application issue only: exact current consumer default-branch commit; repository comes from issue scope"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: generate-database-types
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !inputs.work_issue }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 90
    env:
      # CONFIGURED, not hard-coded. The preview branch is rebuilt from time to time and
      # its project ref CHANGES when it is: on 2026-08-18 rjyboqwcdzcocqgmsyel was deleted
      # and replaced. A literal here pins this lane to a database that no longer exists.
      # Set the repository variable PREVIEW_PROJECT_REF instead. An unset value is
      # REFUSED, never defaulted. See AGENTS.md rule 2.
      PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
      PRODUCTION_PROJECT_REF_NEVER_READ_HERE: qsllyeztdwjgirsysgai
    steps:
      - uses: actions/checkout@v4

      # Same fail-closed identity proof the migration lane uses. A generated
      # contract that silently described PRODUCTION would be a credible-looking
      # lie, so the ref is asserted before any credential is used.
      - name: Assert the target project ref is PREVIEW
        run: |
          set -euo pipefail
          echo "PROJECT REF THIS JOB WILL READ: $PREVIEW_PROJECT_REF"
          if [ -z "${PREVIEW_PROJECT_REF// /}" ]; then
            echo "REFUSED: repository variable PREVIEW_PROJECT_REF is not set. Set it to the CURRENT preview branch project ref. An unset ref is never treated as a default." >&2
            exit 1
          fi
          if ! printf '%s' "$PREVIEW_PROJECT_REF" | grep -Eq '^[a-z]{20}$'; then
            echo "REFUSED: PREVIEW_PROJECT_REF is not a 20-character Supabase project ref." >&2
            exit 1
          fi
          if [ "$PREVIEW_PROJECT_REF" = "$PRODUCTION_PROJECT_REF_NEVER_READ_HERE" ]; then
            echo "REFUSED: types job is pointed at PRODUCTION." >&2
            exit 1
          fi
          echo "REF OK: preview = $PREVIEW_PROJECT_REF (production $PRODUCTION_PROJECT_REF_NEVER_READ_HERE is not this job's target)."

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Generate the typed contract from preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PREVIEW }}
          SCHEMAS: ${{ inputs.schemas }}
        run: |
          set -euo pipefail
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$PREVIEW_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          mkdir -p types
          supabase gen types typescript --linked --schema "$SCHEMAS" > types/database.types.ts
          # A generator that silently emits an empty or truncated file is worse
          # than one that fails, because the empty file compiles.
          test -s types/database.types.ts
          grep -q "export type Database" types/database.types.ts
          echo "Generated $(wc -l < types/database.types.ts) lines for schemas: $SCHEMAS"

      - name: Record exactly what this contract describes
        run: |
          set -euo pipefail
          {
            echo "## Generated database types"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| source project | \`$PREVIEW_PROJECT_REF\` (preview) |"
            echo "| schemas | \`${{ inputs.schemas }}\` |"
            echo "| generated from commit | \`${GITHUB_SHA}\` |"
            echo "| lines | $(wc -l < types/database.types.ts) |"
            echo
            echo "Download the \`database-types\` artifact and commit"
            echo "\`types/database.types.ts\` through a reviewed pull request."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: types/database.types.ts
          if-no-files-found: error

  generate-production-proof:
    if: ${{ inputs.work_issue != '' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    env:
      WORK_ISSUE: ${{ inputs.work_issue }}
      APPLICATION_COMMIT_SHA: ${{ inputs.application_commit_sha }}
      PRODUCTION_PROJECT_REF: qsllyeztdwjgirsysgai
      PREVIEW_PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
      SCHEMAS: public,dflow,plm,core,app,hts_rag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate issue scope and the exact current main checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/generated-types-proof.mjs validate-issue --issue "$WORK_ISSUE"
          node scripts/generated-types-proof.mjs validate-main --issue "$WORK_ISSUE"

      - name: Validate the issue-bound current consumer head
        id: consumer
        env:
          # Existing cross-repository token is used only by bounded read-only GitHub calls.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: node scripts/generated-types-proof.mjs validate-consumer --issue "$WORK_ISSUE"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Authenticate the bounded Management API production identity read
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/generated-types-proof.mjs validate-project --output "$RUNNER_TEMP/supabase-production-project.json"

      - name: Generate fresh types from the verified production project
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase gen types typescript --project-id "$PRODUCTION_PROJECT_REF" --schema "$SCHEMAS" > "$RUNNER_TEMP/database.types.ts"
          node scripts/generated-types-proof.mjs write-proof \
            --issue "$WORK_ISSUE" \
            --typescript "$RUNNER_TEMP/database.types.ts" \
            --project-metadata "$RUNNER_TEMP/supabase-production-project.json" \
            --output "$RUNNER_TEMP/db-generated-types-proof.json"

      - name: Upload issue-bound production proof and exact generated bytes
        uses: actions/upload-artifact@v4
        with:
          name: shared-db-generated-types-${{ inputs.work_issue }}-${{ steps.consumer.outputs.application_commit_sha }}
          path: |
            ${{ runner.temp }}/database.types.ts
            ${{ runner.temp }}/db-generated-types-proof.json
          if-no-files-found: error
          retention-days: 90
