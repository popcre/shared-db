# Lane watchdog + workflow YAML guard (2026-10-23 incident).
#
# WHAT HAPPENED: conflict markers were committed into tools-offline-tests.yml.
# The file could not parse, so the workflow created ZERO jobs for every event.
# Required checks never started, every pull request was unmergeable for hours,
# and nothing failed loudly — a workflow file that cannot parse produces no
# red check, only silence. Separately, the required "Queue-sensitive checks
# (aggregate)" job (pr-guards.yml) waited up to 50 minutes for lane assertions
# that in that incident could never start.
#
# WHAT THIS WORKFLOW DOES ABOUT IT:
#   * On every pull request, merge group entry and manual run, the guard job
#     parses every .github/workflows/*.yml|*.yaml with a real (vendored,
#     dependency-free) YAML parser and refuses conflict markers at column 0 —
#     the loud red check the incident never produced. Its tests run with it.
#   * Every 10 minutes (and on manual dispatch), the watchdog job lists open
#     pull requests and, for each head older than five minutes, checks that
#     every context registered in scripts/db-flow/runner-lanes.json has at
#     least one check run (any status, lane-suffixed names included). A
#     context with ZERO check runs gets exactly ONE replacement dispatch of
#     its owning workflow for that head ref — loop-safe: a dispatch run
#     already bound to the head makes it stand down.
#
# WHAT IT NEVER DOES: never merges, never pushes, never writes refs, never
# touches the database. The only write in the entire feature is the single
# workflow-dispatch POST the watchdog issues through the shared GitHub
# transport (one attempt, never replayed).

name: Lane watchdog

on:
  schedule:
    # Every 10 minutes, offset off the crowded :00/:10 boundaries.
    - cron: '4-54/10 * * * *'
  workflow_dispatch:
  pull_request:
  merge_group:

# actions: write is required only to POST the workflow dispatch; everything
# else stays read-only.
permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: lane-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Workflow YAML guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse conflict markers and unparseable workflow YAML
        run: |
          set -euo pipefail
          node scripts/check-workflow-yaml.mjs

      - name: Prove both guards' decision logic offline
        run: |
          set -euo pipefail
          node --test scripts/check-workflow-yaml.test.mjs scripts/db-flow/lane-watchdog.test.mjs

  watchdog:
    name: Lane watchdog
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dispatch replacement lane runs for contexts with zero check runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/db-flow/lane-watchdog.mjs --repo "$REPO"
