name: Merge Queue Gate

# The cross-event gate for the native merge queue (issue #2530 Phase C Step 7;
# plan_shared_db_popcre_transfer_merge_queue.md).
#
# WHY THIS WORKFLOW EXISTS. A merge group runs on a SYNTHETIC commit -- the one
# queued pull request's head merged onto current main. Owner ruling 2026-10-30
# (popcre/ai-devops#2172 stage C2): this gate keeps only what protects production
# data ordering, and it is advisory (not a required context):
#
#   1. single-PR identity: resolves the ONE pull request the merge_group ref
#      names and re-verifies it against the live API, and proves its head is
#      contained in the synthetic group commit;
#   2. ascending migration versions: re-runs the SQL guards, production
#      sidecars, live-proof probe and version ordering;
#   3. the preview hold: when the PRECEDING main commit added migrations, the
#      group waits until that exact commit carries
#      `Post-merge preview rehearsal: success`.
#
# Guarded-merge authorization, the queue interlock, claims and leases are retired.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read


concurrency:
  group: shared-db-merge-queue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Merge queue gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Must exceed the preview hold's own bounded wait (25 minutes by default)
    # so the hold's refusal is reported by the contract, not by a timeout.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove the queue contract, its configurator, and the workflow coverage map
        run: >-
          node --test
          scripts/merge-queue-contract.test.mjs
          scripts/configure-merge-queue.test.mjs
          scripts/check-merge-queue-workflows.test.mjs
          scripts/guarded-merge-preparation-split.test.mjs

      # Read-only token from the pop-ai-watchers GitHub App: its own API budget, separate
      # from the per-repository Actions installation limit. Writes keep github.token.
      # Absent secret or mint failure -> empty output -> read steps fall back to github.token.
      - name: Mint read-only API token (pop-ai-watchers app)
        id: read_token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.POP_AI_WATCHERS_APP_ID }}
          private-key: ${{ secrets.POP_AI_WATCHERS_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-statuses: read
      - name: Resolve the single queued pull request
        if: github.event_name == 'merge_group'
        id: queue
        env:
          GH_TOKEN: ${{ steps.read_token.outputs.token || github.token }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          facts="$(node scripts/merge-queue-contract.mjs --resolve-queue-pr)"
          echo "$facts"
          tip="$(echo "$facts" | jq -r .headRefOid)"
          echo "pr=$(echo "$facts" | jq -r .number)" >> "$GITHUB_OUTPUT"
          echo "head=$tip" >> "$GITHUB_OUTPUT"

      # popcre/ai-devops#2172 stage C2: the gate keeps only single-PR identity,
      # ascending migration versions, and the preceding-migration preview hold.
      # Guarded-merge authorization, claims and leases are retired.
      - name: Prove the queued PR head is contained in the synthetic group commit
        if: github.event_name == 'merge_group'
        env:
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          PR_TIP: ${{ steps.queue.outputs.head }}
        run: |
          set -euo pipefail
          git cat-file -e "${MERGE_GROUP_SHA}^{commit}"
          git cat-file -e "${PR_TIP}^{commit}"
          git merge-base --is-ancestor "$PR_TIP" "$MERGE_GROUP_SHA" || {
            echo "REFUSED: merge group $MERGE_GROUP_SHA does not contain the queued PR head $PR_TIP." >&2
            exit 1
          }

      - name: Revalidate migration order
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ steps.read_token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          bash scripts/check-sql.sh
          node scripts/check-production-verification-sidecars.mjs --base origin/main
          node scripts/check-live-proof-probe.mjs
          node scripts/merge-queue-contract.mjs

      - name: Require the latest preceding migration merge to have completed preview rehearsal
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ steps.read_token.outputs.token || github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${BASE_SHA}^{commit}"
          target="$(node scripts/merge-queue-contract.mjs --preview-rehearsal-target --base-sha "$BASE_SHA" --group-sha "$GITHUB_SHA")"
          if [ "$target" = none ]; then
            echo 'This group changes no migration; shared-preview ordering is preserved for the next migration group.'
            exit 0
          fi
          node scripts/merge-queue-contract.mjs --require-preview-rehearsal --sha "$target" --base-sha "$BASE_SHA"
