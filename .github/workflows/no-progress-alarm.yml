name: No-progress alarm

# Two-hour no-progress alarm (issue #3027, programme popcre/ai-devops#401 Step 4).
# Every 30 minutes it reads the live claim-first coordination state and, when an owned outcome has had no
# stage transition for more than 120 minutes or nothing closed in four hours, posts one comment
# on the claim-first session identity naming each stuck outcome, its blocker and the unblock action, with
# the sealed snapshot a successor resumes from. Transition-only: an alarm already posted on the
# target issue is never reposted. It also names a ready structural request the queue audit would
# admit but that has had no `entered` event for more than 30 minutes (issue #3148). It reads GitHub and writes one issue comment; nothing else.
#
# Promotion-lane stalls (plan_go-live-lane-prevention.md §9 3.2/3.3, issue #5782): the same
# tick reads the go-live lane, read-only — the promotion selector's --dry-run trace (never
# dispatching), the last successful apply, the latest Queue Hygiene Report run and the
# promotion merge freeze record. It alarms on a PR held by a review finding over 60 minutes,
# on a change out of automatic attempts (the ENGINEER ACTION REQUIRED text on a channel
# someone reads), on a starved lane (candidates exist, nothing applied in 60 minutes), on a
# Queue Hygiene Report run that concluded failure, and names the merges-are-paused complaint
# whenever a promotion freeze has been live over 15 minutes.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      post_issue:
        description: 'Post to this issue instead of the claim-first session identity (canary). Empty = marker.'
        required: false
        default: ''
      now:
        description: 'Evaluate as of this ISO instant (a staged stall). Empty = the real current time.'
        required: false
        default: ''
      staged_label:
        description: 'Heading prefix that marks a canary or staged alarm, e.g. STAGED CANARY.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: read
  # Required: the promotion-lane inputs read workflow runs (review finding
  # popcre/shared-db#5922). A declared permissions block zeroes every unlisted
  # scope, and without actions:read every tick 403s into a standing
  # instrument_down alarm — the alarm dead on arrival.
  actions: read

concurrency:
  group: no-progress-alarm
  cancel-in-progress: false

jobs:
  alarm:
    name: No-progress alarm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove the alarm before trusting it
        run: node --test scripts/db-flow/no-progress-alarm.test.mjs scripts/flow-snapshot.test.mjs
      - name: Raise the alarm on a new stall
        env:
          GH_TOKEN: ${{ github.token }}
          POST_ISSUE: ${{ inputs.post_issue }}
          NOW: ${{ inputs.now }}
          STAGED_LABEL: ${{ inputs.staged_label }}
        run: |
          set -euo pipefail
          args=(--alarm --repo "$GITHUB_REPOSITORY")
          [ -n "${POST_ISSUE:-}" ] && args+=(--post-issue "$POST_ISSUE")
          [ -n "${NOW:-}" ] && args+=(--now "$NOW")
          [ -n "${STAGED_LABEL:-}" ] && args+=(--staged-label "$STAGED_LABEL")
          node scripts/db-flow/no-progress-alarm.mjs "${args[@]}" | tee alarm.json
          { echo '### No-progress alarm'; echo '```json'; grep -v '"body"' alarm.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
