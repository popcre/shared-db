name: Production Apply Review Evidence

on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: "Exact current 40-character main SHA"
        type: string
        required: true
      ordered_allowlist:
        description: "Exact ordered comma-separated migration allowlist"
        type: string
        required: true
      verdict:
        description: "Review verdict"
        type: choice
        required: true
        options: [APPROVE, REQUEST_CHANGES]
      reviewer_label:
        description: "Legacy description only; never authorizes approval"
        type: string
        required: false
      independent_review_run_id:
        description: "Authenticated independent reviewer workflow run ID"
        type: string
        required: true
      independent_review_artifact_digest:
        description: "Pinned SHA256 of independent reviewer artifact"
        type: string
        required: true
      source_pr:
        description: "Merged authoring pull request"
        type: string
        required: true
      source_pr_head:
        description: "Exact authoring pull request head"
        type: string
        required: true
      work_issue:
        description: "Admitted structural work issue"
        type: string
        required: true
      preview_run_id:
        description: "Preview apply run ID"
        type: string
        required: true
      preview_artifact_digest:
        description: "Preview artifact SHA256"
        type: string
        required: true
      dry_run_run_id:
        description: "Read-only production dry-run run ID"
        type: string
        required: true
      dry_run_artifact_digest:
        description: "Dry-run artifact SHA256 including risk vector"
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    name: Record immutable review evidence
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # A stalled step must fail on its own budget instead of blocking merges for hours (#1266).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
      - name: Prove exact current main commit
        env:
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$REVIEWED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$REVIEWED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$REVIEWED_MAIN_SHA"
          MAIN_SHA="$REVIEWED_MAIN_SHA" node scripts/check-main-tip-freshness.mjs
      - name: Re-fetch independent decision and write separate operator record
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          ORDERED_ALLOWLIST: ${{ inputs.ordered_allowlist }}
          REVIEW_RUN_ID: ${{ inputs.independent_review_run_id }}
          REVIEW_DIGEST: ${{ inputs.independent_review_artifact_digest }}
          SOURCE_PR: ${{ inputs.source_pr }}
          SOURCE_HEAD: ${{ inputs.source_pr_head }}
          WORK_ISSUE: ${{ inputs.work_issue }}
          PREVIEW_RUN: ${{ inputs.preview_run_id }}
          PREVIEW_DIGEST: ${{ inputs.preview_artifact_digest }}
          DRY_RUN: ${{ inputs.dry_run_run_id }}
          DRY_DIGEST: ${{ inputs.dry_run_artifact_digest }}
          OPERATOR_ACTOR: ${{ github.actor }}
          REVIEW_VERDICT: ${{ inputs.verdict }}
        run: |
          test "$REVIEW_VERDICT" = "APPROVE"
          python scripts/production_independent_review.py \
            --review-run-id "$REVIEW_RUN_ID" --review-digest "$REVIEW_DIGEST" \
            --main-sha "$REVIEWED_MAIN_SHA" --allowlist "$ORDERED_ALLOWLIST" \
            --source-pr "$SOURCE_PR" --source-pr-head "$SOURCE_HEAD" \
            --work-issue "$WORK_ISSUE" --preview-run-id "$PREVIEW_RUN" \
            --preview-digest "$PREVIEW_DIGEST" --dry-run-run-id "$DRY_RUN" \
            --dry-run-digest "$DRY_DIGEST" --operator-actor "$OPERATOR_ACTOR" \
            --operator-run-id "$GITHUB_RUN_ID" --operator-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/production-apply-review-evidence.json"
      - name: Upload immutable review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-apply-review-evidence
          path: ${{ runner.temp }}/production-apply-review-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce approving verdict
        env:
          REVIEW_VERDICT: ${{ inputs.verdict }}
        run: test "$REVIEW_VERDICT" = "APPROVE"
