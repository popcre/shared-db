name: task gates

on:
  pull_request:
    paths:
      - '.ai-devops/**'
      - '.github/workflows/task-gates.yml'
      - 'scripts/tests/test-task-gates.sh'
  push:
    branches: [main]
    paths:
      - '.ai-devops/**'
      - '.github/workflows/task-gates.yml'
      - 'scripts/tests/test-task-gates.sh'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run for its older head; pushes to
# main and manual runs are never cancelled.
concurrency:
  group: task-gates-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Step 2.8 (#2367): every job gets its own budget. This suite runs shell
    # tests that never wait on external state; twenty minutes is far above its
    # observed run time and a hang must fail on its own budget (#1266).
    timeout-minutes: 20
    steps:
      - name: Check out shared-db
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out accepted task-gate engine
        # popcre/ai-devops is public, so the default token can read this exact
        # source-of-truth commit without a cross-repository secret.
        uses: actions/checkout@v4
        with:
          repository: popcre/ai-devops
          ref: dc33fa813cae7bada6336370290a4a910a371dce
          path: .task-gates-toolkit
          persist-credentials: false

      - name: Install task-gate commands on the runner path
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -s "$GITHUB_WORKSPACE/.task-gates-toolkit/bin/ai-task-gates" "$HOME/.local/bin/ai-task-gates"
          ln -s "$GITHUB_WORKSPACE/.task-gates-toolkit/bin/ai-repo-policy" "$HOME/.local/bin/ai-repo-policy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify installed command and consumer policy
        shell: bash
        run: |
          ai-task-gates version
          scripts/tests/test-task-gates.sh
